<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izzy's Game World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: loud, happy, toy-box; a 6-year-old's sports day.
   IDEA: a sunny 3D sports field where Izzy's balls bounce forever.
   PICTURE: three.js field with hoop, goal and bouncing balls behind a giant 3D "IZZY".
   COLOUR and TYPE: sky blue, grass green, sunshine yellow, ball orange; Luckiest Guy + Fredoka.
   LAYOUT: start screen, giant name, ball launchers, game cards, team jerseys. TV-size targets. */
:root{color-scheme:light;--sky:#3fb6ff;--grass:#2fc463;--sun:#ffd23f;--orange:#ff7a1a;--red:#ff3b5c;--blue:#1fa7ff;--navy:#14215a}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;font:600 clamp(18px,1.4vw,26px)/1.4 Fredoka,"Trebuchet MS",system-ui,sans-serif;color:var(--navy);background:linear-gradient(#3aa8ff,#bfe9ff 58%,#3cc768 58%);background-attachment:fixed;overflow-x:clip;-webkit-tap-highlight-color:transparent}
#world{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
main{position:relative;z-index:2}
button{font:inherit;color:inherit;cursor:pointer}
[data-nav]{transition:transform .18s ease,box-shadow .18s ease;outline:none}
[data-nav]:focus{outline:7px solid var(--sun);outline-offset:6px;box-shadow:0 0 0 16px rgba(255,210,63,.35)}
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px max(3vw,14px);pointer-events:none}
.bar>*{pointer-events:auto}
.logo{font-family:"Luckiest Guy",Impact,sans-serif;font-size:clamp(24px,2.2vw,38px);color:#fff;text-shadow:0 4px 0 var(--navy);background:none;border:0;padding:8px 16px;border-radius:999px;display:flex;align-items:center;gap:10px}
.logo svg{width:1.3em;height:1.3em}
.tog{display:flex;gap:14px}
.ibtn{width:clamp(60px,5vw,84px);height:clamp(60px,5vw,84px);border-radius:50%;border:5px solid #fff;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25);padding:0}
.ibtn svg{width:56%;height:56%}
.ibtn .x{display:none}
.ibtn.off{background:#8c94b8}.ibtn.off .x{display:inline}
/* hero */
.hero{min-height:100vh;min-height:100svh;display:grid;justify-items:center;align-content:center;gap:clamp(14px,3vh,36px);padding:110px 16px 50px;text-align:center}
.name{display:flex;justify-content:center;gap:clamp(2px,1vw,18px);margin:0;font-family:"Luckiest Guy",Impact,sans-serif;font-weight:400;font-size:clamp(110px,22vw,330px);line-height:.95;perspective:900px}
.name button{background:none;border:0;padding:0 .03em;border-radius:28px;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.4s)}
.name.pre button{opacity:0}
.name.in button{animation:drop 1s cubic-bezier(.3,1.5,.6,1) both,bob 2.6s ease-in-out 1.4s infinite;animation-delay:calc(var(--i) * .14s),calc(1.2s + var(--i) * -.4s)}
.name .l{display:block;color:var(--c);-webkit-text-stroke:.022em #fff;text-shadow:0 .02em 0 var(--d),0 .04em 0 var(--d),0 .06em 0 var(--d),0 .08em 0 var(--d),0 .1em 0 var(--navy),0 .17em .1em rgba(0,0,0,.35)}
.name .l.jump{animation:spin .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-.07em) rotate(4deg)}}
@keyframes drop{0%{transform:translateY(-110vh) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes spin{0%{transform:none}45%{transform:translateY(-.3em) rotateY(180deg) scale(1.25)}100%{transform:rotateY(360deg)}}
.tag{font-family:"Luckiest Guy",Impact,sans-serif;font-size:clamp(30px,4.2vw,66px);color:#fff;background:var(--navy);padding:.2em .7em .05em;border-radius:999px;transform:rotate(-3deg);box-shadow:0 8px 0 rgba(0,0,0,.2);margin:0;letter-spacing:.02em}
.throw{display:flex;gap:clamp(16px,3vw,44px);flex-wrap:wrap;justify-content:center}
.ball{width:clamp(96px,10vw,150px);aspect-ratio:1;border-radius:50%;border:0;background:none;padding:0;filter:drop-shadow(0 10px 0 rgba(0,0,0,.22))}
.ball svg{width:100%;height:100%;display:block;animation:roll 6s linear infinite}
.ball:nth-child(2) svg{animation-duration:7s;animation-direction:reverse}
.ball:hover,.ball:focus{transform:scale(1.12) translateY(-6px)}
.ball.pop{animation:popb .45s}
@keyframes roll{to{transform:rotate(360deg)}}
@keyframes popb{40%{transform:scale(.8)}100%{transform:scale(1)}}
.go-down{display:flex;align-items:center;gap:14px;font-family:"Luckiest Guy",Impact,sans-serif;font-size:clamp(28px,3vw,48px);color:var(--navy);background:var(--sun);border:6px solid #fff;border-radius:999px;padding:.35em 1em .2em;box-shadow:0 10px 0 #c98f00}
.cta{display:flex;gap:clamp(14px,2vw,28px);flex-wrap:wrap;justify-content:center}
.explore{background:#2fd06a;color:#fff;box-shadow:0 10px 0 #178a40;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.explore svg{animation:none}
.nogl .explore{display:none}
main{transition:opacity .45s}
body.walk main,body.create main{opacity:0;pointer-events:none;visibility:hidden}
body.create{overflow:hidden}
.player{background:var(--orange);color:#fff;box-shadow:0 10px 0 #b84d00;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.player svg{animation:none}
.cui{display:none;position:fixed;inset:0;z-index:25;pointer-events:none}
body.create .cui{display:block}
.cpanel{pointer-events:auto;position:absolute;right:max(2vw,12px);top:clamp(92px,11vh,120px);bottom:16px;width:min(620px,50vw);overflow-y:auto;background:rgba(255,255,255,.95);border:7px solid #fff;border-radius:40px;box-shadow:0 14px 0 rgba(20,33,90,.2);padding:clamp(16px,2vw,30px);display:grid;gap:clamp(12px,1.6vw,22px);align-content:start}
.cpanel h2{margin:0;font-size:clamp(40px,4vw,64px)}
.crow{display:grid;gap:10px}
.crow>b{font-family:"Luckiest Guy",Impact,sans-serif;font-weight:400;font-size:clamp(24px,2vw,34px)}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.swb{width:clamp(54px,4.4vw,72px);aspect-ratio:1;border-radius:50%;border:5px solid #fff;background:var(--s);box-shadow:0 5px 0 rgba(20,33,90,.25);padding:0;display:grid;place-items:center}
.swb.sel{box-shadow:0 0 0 6px var(--navy),0 5px 0 rgba(20,33,90,.25);transform:scale(1.1)}
.pets .swb{background:#eaf6ff;width:clamp(68px,5.4vw,90px)}
.swb svg{width:80%;height:80%}
.numrow{display:flex;align-items:center;gap:18px}
.nbtn{width:clamp(60px,5vw,76px);aspect-ratio:1;border-radius:50%;border:5px solid #fff;background:var(--navy);color:#fff;font:400 clamp(36px,3vw,48px)/1 "Luckiest Guy",Impact,sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.25);padding:0}
#numVal{font:400 clamp(52px,5vw,80px)/1 "Luckiest Guy",Impact,sans-serif;min-width:2ch;text-align:center}
.padwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
#pad{width:min(256px,56vw);aspect-ratio:1;border-radius:24px;border:5px dashed #9fb3d9;background:#f4f8ff;touch-action:none;cursor:crosshair}
.pens{display:grid;grid-template-columns:repeat(2,auto);gap:10px}
.pens .swb{width:56px}
#doneCreate{justify-self:center;margin-top:6px}
@media (max-width:900px){.cpanel{left:10px;right:10px;width:auto;top:48vh;bottom:10px;border-radius:30px}}
body.walk{overflow:hidden}
.wui{display:none}
body.walk .wui{display:grid}
#exitWalk{position:fixed;left:max(3vw,14px);top:clamp(90px,10vh,120px);z-index:30;place-items:center;grid-auto-flow:column;gap:10px;font-family:"Luckiest Guy",Impact,sans-serif;font-size:clamp(24px,2.4vw,40px);color:#fff;background:var(--navy);border:6px solid #fff;border-radius:999px;padding:.3em .9em .15em;box-shadow:0 8px 0 rgba(0,0,0,.25)}
#exitWalk svg{width:1em;height:1em}
#stick,#jumpBtn{position:fixed;z-index:30;bottom:max(5vh,22px);touch-action:none;-webkit-user-select:none;user-select:none}
#stick{left:max(4vw,22px);width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.35);border:6px solid #fff}
#knob{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px;border-radius:50%;background:var(--sun);border:5px solid #fff;box-shadow:0 6px 0 #c98f00;pointer-events:none}
#jumpBtn{right:max(4vw,22px);width:130px;height:130px;border-radius:50%;background:#2fd06a;border:6px solid #fff;color:#fff;font-family:"Luckiest Guy",Impact,sans-serif;font-size:34px;box-shadow:0 8px 0 #178a40;place-items:center;padding:0}
@media (hover:hover) and (pointer:fine){body.walk #stick,body.walk #jumpBtn{display:none}}
.go-down svg{width:1em;height:1em;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(.2em)}}
/* panels */
.band{padding:clamp(30px,5vw,80px) max(4vw,16px)}
.panel{max-width:1440px;margin:0 auto;background:rgba(255,255,255,.9);border:7px solid #fff;border-radius:44px;box-shadow:0 16px 0 rgba(20,33,90,.2);padding:clamp(20px,3vw,52px)}
h2{font-family:"Luckiest Guy",Impact,sans-serif;font-weight:400;font-size:clamp(44px,5.5vw,88px);line-height:1.05;margin:0 0 clamp(16px,2vw,32px);display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
h2 svg{width:1.1em;height:1.1em;flex:none}
h2 .count{font-size:.5em;background:var(--orange);color:#fff;border-radius:999px;padding:.2em .6em .05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:clamp(20px,2.2vw,36px)}
.card{position:relative;display:flex;flex-direction:column;align-items:center;border:7px solid #fff;border-radius:36px;background:var(--c);padding:0 0 20px;overflow:hidden;color:#fff;box-shadow:0 12px 0 rgba(20,33,90,.25);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card:focus,.card:hover{transform:perspective(800px) rotateX(var(--rx,4deg)) rotateY(var(--ry,0deg)) scale(1.05)}
.art{width:100%;aspect-ratio:4/3;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),transparent 62%)}
.art svg{width:62%;height:80%;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 12px 0 rgba(0,0,0,.18))}
.card:nth-child(2n) .art svg{animation-delay:-1.5s}
@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}
.ctitle{font-family:"Luckiest Guy",Impact,sans-serif;font-size:clamp(28px,2.3vw,42px);line-height:1.05;padding:4px 14px 12px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.badge{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:999px;background:rgba(20,33,90,.85);font-weight:700}
.badge svg{width:1.1em;height:1.1em}
.card.ready .badge{background:var(--sun);color:var(--navy)}
.wiggle{animation:wig .5s}
@keyframes wig{20%{rotate:-5deg}40%{rotate:5deg}60%{rotate:-3deg}80%{rotate:2deg}}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(20px,2.2vw,36px)}
.mate{border:0;background:none;padding:10px;border-radius:32px;display:grid;justify-items:center;gap:6px}
.mate svg{width:min(100%,260px);aspect-ratio:1;filter:drop-shadow(0 12px 0 rgba(20,33,90,.2))}
.mate b{font-family:"Luckiest Guy",Impact,sans-serif;font-weight:400;font-size:clamp(30px,2.6vw,46px)}
.mate:hover svg,.mate:focus svg{animation:float 1.6s ease-in-out infinite}
footer{text-align:center;padding:10px 16px 60px;font-family:"Luckiest Guy",Impact,sans-serif;font-size:clamp(22px,2vw,34px);color:#fff;text-shadow:0 3px 0 var(--navy)}
#toast{position:fixed;left:50%;bottom:8vh;z-index:70;transform:translate(-50%,40px) scale(.6);opacity:0;pointer-events:none;font-family:"Luckiest Guy",Impact,sans-serif;font-size:clamp(34px,4vw,64px);color:var(--navy);background:var(--sun);border:7px solid #fff;border-radius:999px;padding:.3em 1em .15em;box-shadow:0 12px 0 #c98f00;transition:.3s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
/* start screen */
#start{position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;gap:clamp(18px,4vh,40px);background:radial-gradient(circle at 50% 42%,#6fd6ff,#1468d6 75%);transition:opacity .7s,visibility .7s;text-align:center;padding:20px;cursor:pointer}
#start.gone{opacity:0;visibility:hidden}
#start h1{margin:0;font-family:"Luckiest Guy",Impact,sans-serif;font-weight:400;font-size:clamp(64px,10vw,150px);line-height:1;color:#fff;text-shadow:0 6px 0 var(--navy),0 14px 20px rgba(0,0,0,.3)}
#go{width:clamp(180px,22vw,300px);aspect-ratio:1;border-radius:50%;border:12px solid #fff;background:var(--sun);box-shadow:0 14px 0 #c98f00;display:grid;place-items:center;animation:pulse 1.5s ease-in-out infinite;padding:0;outline:none}
#go svg{width:46%;margin-left:10%}
@keyframes pulse{50%{transform:scale(1.08)}}
.hint{display:flex;align-items:center;gap:14px;font-size:clamp(24px,2.4vw,40px);color:#fff;font-weight:700}
.abtn{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:#2fd06a;color:#fff;border:4px solid #fff;font-family:"Luckiest Guy",Impact,sans-serif}
@media (max-width:600px){.hero{padding-top:100px}.tog{gap:8px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>

<div id="start" role="dialog" aria-label="Start">
  <h1>Hi Izzy!</h1>
  <button id="go" aria-label="Let's play"><svg viewBox="0 0 100 100"><path d="M18 8 L92 50 L18 92 Z" fill="#14215a" stroke="#14215a" stroke-width="10" stroke-linejoin="round"/></svg></button>
  <div class="hint"><span>Tap</span> <span>or</span> <span class="abtn">A</span></div>
</div>

<header class="bar">
  <button class="logo" data-nav id="home" aria-label="Back to top"><svg viewBox="0 0 100 100"><path d="M50 5l13 30 32 3-24 21 7 32-28-17-28 17 7-32L5 38l32-3z" fill="#ffd23f" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>Izzy's World</button>
  <div class="tog">
    <button class="ibtn" id="musicBtn" data-nav aria-label="Music on or off"><svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"><path d="M38 72V18l44-8v52"/><circle cx="28" cy="74" r="12" fill="#fff"/><circle cx="72" cy="66" r="12" fill="#fff"/><path class="x" d="M10 10l80 80" stroke="#ff3b5c" stroke-width="11"/></svg></button>
    <button class="ibtn" id="soundBtn" data-nav aria-label="Sound on or off"><svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 38h16l22-18v60L28 62H12z" fill="#fff"/><path d="M64 36q10 14 0 28M74 26q20 24 0 48"/><path class="x" d="M10 10l80 80" stroke="#ff3b5c" stroke-width="11"/></svg></button>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <h2 class="name pre" id="name" aria-label="Izzy"></h2>
    <p class="tag">Game World</p>
    <div class="throw" id="throw"></div>
    <div class="cta">
    <button class="go-down explore" data-nav id="explore">Explore <svg viewBox="0 0 100 100"><path d="M24 12L88 50L24 88Z" fill="#fff"/></svg></button>
    <button class="go-down player" data-nav id="playerBtn">My Player <svg viewBox="0 0 100 100"><path d="M34 8L14 16L2 38L18 46L22 42L22 94L78 94L78 42L82 46L98 38L86 16L66 8Q50 22 34 8Z" fill="#fff"/></svg></button>
    <button class="go-down" data-nav id="toGames">My Games <svg viewBox="0 0 100 100"><path d="M20 35l30 30 30-30" fill="none" stroke="#14215a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </section>

  <section class="band" id="games">
    <div class="panel">
      <h2><span id="gIcon"></span>My Games <span class="count" id="gCount"></span></h2>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="band" id="team">
    <div class="panel">
      <h2><span id="tIcon"></span>My Team</h2>
      <div class="team" id="teamGrid"></div>
    </div>
  </section>

  <footer>Made with love for Izzy</footer>
</main>
<button class="wui" id="exitWalk" aria-label="Back"><svg viewBox="0 0 100 100"><path d="M62 16L28 50l34 34" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
<div class="wui" id="stick" aria-hidden="true"><div id="knob"></div></div>
<button class="wui" id="jumpBtn" aria-label="Jump">Jump</button>
<section class="cui" id="creator" aria-label="My Player">
  <div class="cpanel">
    <h2>My Player</h2>
    <div class="crow"><b>Shirt</b><div class="sw" data-k="shirt"></div></div>
    <div class="crow"><b>Number</b><div class="numrow"><button class="nbtn" data-nav id="numDown" aria-label="Smaller number">-</button><span id="numVal">1</span><button class="nbtn" data-nav id="numUp" aria-label="Bigger number">+</button></div></div>
    <div class="crow"><b>Cap</b><div class="sw" data-k="cap"></div></div>
    <div class="crow"><b>Shoes</b><div class="sw" data-k="shoes"></div></div>
    <div class="crow"><b>Pet</b><div class="sw pets" data-k="pet"></div></div>
    <div class="crow"><b>My Logo</b><div class="padwrap"><canvas id="pad" width="256" height="256" aria-label="Draw your logo"></canvas><div class="pens" id="pens"></div></div></div>
    <button class="go-down explore" data-nav id="doneCreate">Done! <svg viewBox="0 0 100 100"><path d="M18 52l22 22 44-48" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</section>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
/* ======================================================
   ADD A NEW GAME: copy one line below, change it.
   status: 'soon' (locked)  or  'ready' (with url to play)
   art: basketball | soccer | baseball | buddies | family | planet | city
   ====================================================== */
const GAMES = [
  {title:"Izzy's Sunny City", art:'city',      color:'#ff8fb8', status:'ready', url:'city/'},
  {title:"Izzy's Hoop Shot", art:'basketball', color:'#ff7a1a', status:'ready', url:'hoop-shot/'},
  {title:'Goal Blaster',     art:'soccer',     color:'#2fc463', status:'soon', url:''},
  {title:'Home Run Rocket',  art:'baseball',   color:'#ff3b5c', status:'soon', url:''},
  {title:'Brother Buddies',  art:'buddies',    color:'#1fa7ff', status:'soon', url:''},
  {title:'Family Fun Day',   art:'family',     color:'#f5b700', status:'soon', url:''},
  {title:'Ball Planet 3D',   art:'planet',     color:'#14215a', status:'soon', url:''}
];
const TEAM = [
  {name:'Izzy',       num:'1', color:'#ff7a1a', cheer:'Go Izzy!'},
  {name:'AJ',         num:'2', color:'#1fa7ff', cheer:'Go A J!'},
  {name:'Family',     heart:true, color:'#ff3b5c', cheer:'Family team!'}
];

const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = (k,v) => { try{ if(v===undefined){const r=localStorage.getItem('izzy-'+k);return r===null?true:r==='1'} localStorage.setItem('izzy-'+k,v?'1':'0') }catch(e){ return true } };

/* ---------- pictures ---------- */
let uid = 0;
const pent = (cx,cy,r,rot) => { const p=[]; for(let k=0;k<5;k++){const a=rot+k*Math.PI*2/5;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))} return p.join(' ') };
const face = (x,y,r,cap) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffcf9e" stroke="#14215a" stroke-width="3"/><path d="M${x-r} ${y-2} a${r} ${r} 0 0 1 ${2*r} 0z" fill="${cap}" stroke="#14215a" stroke-width="3"/><rect x="${x}" y="${y-5}" width="${r*.95}" height="${r*.24}" rx="${r*.1}" fill="${cap}" stroke="#14215a" stroke-width="2.5"/><circle cx="${x-r*.35}" cy="${y+r*.22}" r="${r*.11}" fill="#14215a"/><circle cx="${x+r*.35}" cy="${y+r*.22}" r="${r*.11}" fill="#14215a"/><path d="M${x-r*.42} ${y+r*.48} q${r*.42} ${r*.4} ${r*.84} 0" fill="none" stroke="#14215a" stroke-width="3" stroke-linecap="round"/>`;

/* ---------- sound (Web Audio, made in code) ---------- */
let ac=null, master, sfx, mus, noiseBuf, musicTimer=null, nextT=0, stepI=0;
let soundOn = store('sound'), musicOn = store('music');
function initAudio(){
  if(ac){ if(ac.state!=='running') ac.resume(); return }
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  ac = new AC();
  const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
  master = ac.createGain(); master.gain.value = soundOn?1:0; master.connect(comp);
  sfx = ac.createGain(); sfx.gain.value = .55; sfx.connect(master);
  mus = ac.createGain(); mus.gain.value = .2; mus.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function tone(f,dur=.15,type='sine',v=.5,delay=0,f2=0,dest=sfx,abs=0){
  if(!ac) return; const t = abs || ac.currentTime+delay;
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+.05);
}
function noise(dur=.2,v=.3,delay=0,freq=2000,dest=sfx,abs=0){
  if(!ac) return; const t = abs || ac.currentTime+delay;
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=.8;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+.05);
}
const SFX = {
  tick: ()=>tone(880,.07,'triangle',.22),
  boing:()=>{tone(170,.38,'sine',.7,0,560);tone(340,.26,'triangle',.18,.04,900)},
  kick: ()=>{tone(160,.2,'sine',.9,0,45);noise(.09,.35,0,900)},
  crack:()=>{noise(.12,.8,0,2600);tone(1100,.09,'square',.18,0,300);[784,988,1175].forEach((f,i)=>tone(f,.25,'triangle',.25,.12+i*.07))},
  chime:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.45,'triangle',.32,i*.08)),
  soon: ()=>{tone(392,.16,'triangle',.35);tone(311,.3,'triangle',.35,.14)},
  cheer:()=>{noise(.9,.25,0,1400);[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.3,'square',.1,i*.07))},
  note: i=>{const f=[523,659,784,1047][i]||660;tone(f,.55,'triangle',.4);tone(f*2,.3,'sine',.12,.02);tone(f/2,.2,'sine',.3,0,f)}
};
const BALL_SFX = {basketball:'boing',soccer:'kick',baseball:'crack'};
function say(text){
  if(!soundOn || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.pitch=1.5; u.rate=.95; speechSynthesis.speak(u) }catch(e){}
}
/* happy little song: C F G C, 8 steps a bar */
const MEL=[72,0,76,79,76,0,72,74, 77,0,81,77,76,0,74,72, 74,0,79,83,81,79,77,74, 76,79,84,0,79,0,72,0];
const ROOT=[48,53,55,48];
const mf = m => 440*2**((m-69)/12);
function playStep(i,t){
  const n=MEL[i]; if(n) tone(mf(n),.28,'triangle',.32,0,0,mus,t);
  const s=i%8, root=ROOT[i>>3];
  if(s===0||s===4) { tone(mf(root),.32,'triangle',.5,0,0,mus,t); tone(140,.14,'sine',.7,0,45,mus,t) }
  if(s===6) tone(mf(root+7),.2,'triangle',.4,0,0,mus,t);
  if(s===2||s===6) noise(.12,.25,0,1800,mus,t);
  if(s%2) noise(.04,.12,0,7000,mus,t);
}
function startMusic(){
  if(!ac || musicTimer) return; nextT = ac.currentTime+.1; const step = 60/118/2;
  musicTimer = setInterval(()=>{ while(nextT < ac.currentTime+.15){ playStep(stepI,nextT); nextT+=step; stepI=(stepI+1)%MEL.length } },30);
}
function stopMusic(){ clearInterval(musicTimer); musicTimer=null }
function paintToggles(){ $('#soundBtn').classList.toggle('off',!soundOn); $('#musicBtn').classList.toggle('off',!musicOn) }
paintToggles();

$('#musicBtn').addEventListener('click',()=>{ initAudio(); musicOn=!musicOn; store('music',musicOn); musicOn?startMusic():stopMusic(); paintToggles(); SFX.tick() });

/* ---------- confetti ---------- */
const fx=$('#fx'), fc=fx.getContext('2d'); let parts=[], fxOn=false;
const COLS=['#ff7a1a','#ffd23f','#2fd06a','#1fa7ff','#ff3b5c','#ffffff'];
function sizeFx(){ fx.width=innerWidth; fx.height=innerHeight } sizeFx();
function burst(x,y,n=40){
  if(reduce) n=Math.min(n,12);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, s=4+Math.random()*9; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COLS[i%COLS.length],w:8+Math.random()*10,life:70+Math.random()*40,star:Math.random()<.3})}
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}
}
function fxLoop(){
  fc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life-->0&&p.y<fx.height+40);
  for(const p of parts){p.vy+=.35;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.globalAlpha=Math.min(1,p.life/30);fc.fillStyle=p.c;
    if(p.star){fc.beginPath();for(let k=0;k<10;k++){const rr=k%2?p.w*.4:p.w;fc.lineTo(Math.cos(k*Math.PI/5)*rr,Math.sin(k*Math.PI/5)*rr)}fc.fill()}else fc.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fc.restore()}
  if(parts.length) requestAnimationFrame(fxLoop); else {fxOn=false;fc.clearRect(0,0,fx.width,fx.height)}
}
const centerOf = el => { const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2] };
let toastT; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1600) }

const World = { throwBall(){}, ready:false, ok:false, walk:false, keys:{}, pad:{x:0,y:0}, touch:{x:0,y:0}, jump:false, create:false, setWalk(){}, setCreate(){} };
function initWorld(){
  if(!window.THREE) return;
  const T = THREE, canvas = $('#world');
  let renderer; try{ renderer = new T.WebGLRenderer({canvas,antialias:true}) }catch(e){ return }
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  const scene = new T.Scene();
  const cv = (w,h,draw) => { const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new T.CanvasTexture(c); t.anisotropy=4; return t };
  scene.background = cv(4,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#1f8cff');gr.addColorStop(.6,'#8fd8ff');gr.addColorStop(1,'#e6f8ff');g.fillStyle=gr;g.fillRect(0,0,w,h)});
  scene.fog = new T.Fog(0xcdeeff, 32, 75);

        else { SFX.soon(); toast('Coming soon!'); izzy.position.x+=(izzy.position.x-p.x)/d*1.4; izzy.position.z+=(izzy.position.z-p.z)/d*1.4 } } }
  }
  function kick(k,reach){
    for(const b of balls){ const u=b.userData, dx=b.position.x-k.position.x, dz=b.position.z-k.position.z, d=Math.hypot(dx,dz);
      if(d<u.r+reach && b.position.y<2.6+k.position.y && d>0){ u.v.x=dx/d*10; u.v.z=dx===0&&dz===0?0:dz/d*10; u.v.y=Math.max(u.v.y,7); b.position.x=k.position.x+dx/d*(u.r+reach); b.position.z=k.position.z+dz/d*(u.r+reach);
        if(time-lastHit>.2){ lastHit=time; SFX[BALL_SFX[u.kind]]() } } }
  }
  // ---- giant 3D IZZY letters ----
  const LSHAPE={ // [x,y,w,h,rotZ] in cells (letter is 3 wide, 5 tall)
    I:[[1,2,1,5,0],[1,4.5,3,1,0],[1,-.5+0.5,3,1,0]],
    Z:[[1,4.5,3,1,0],[1,0,3,1,0],[1,2.25,1,4.6,-.62]],
    Y:[[1,1,1,3,0],[.45,3.6,1,2.6,.55],[1.55,3.6,1,2.6,-.55]]
  };
  const CELL=.8, letters=[];
  LETTERS.forEach(([ch,c,d],i)=>{
    const pivot=new T.Group(), body=new T.Group(); pivot.add(body);
    const face=new T.MeshStandardMaterial({color:c,roughness:.35,emissive:new T.Color(c),emissiveIntensity:.08}), side=new T.MeshStandardMaterial({color:d,roughness:.5});
    const mats=[side,side,face,side,face,face];
    for(const [x,y,w,h,rz] of LSHAPE[ch]){
      const m=new T.Mesh(new T.BoxGeometry(w*CELL,h*CELL,.9),mats); m.position.set((x-1)*CELL,(y+.5)*CELL,0); m.rotation.z=rz; m.castShadow=true; m.receiveShadow=true; m.userData.letter=i; body.add(m);
    }
    const x=(i-1.5)*3.1; pivot.position.set(x,0,-5.6); pivot.rotation.y=-x*.03; scene.add(pivot);
    letters.push({pivot,i,x,z:-5.6,ang:0,vel:0,axis:new T.Vector3(1,0,0),state:'up',t:0,cool:0});
  });
  const letterMeshes=[]; letters.forEach(L=>L.pivot.traverse(o=>{if(o.isMesh)letterMeshes.push(o)}));
  const tmpV=new T.Vector3(), up=new T.Vector3(0,1,0);
  function knock(L,fromX,fromZ,power=1){
    if(L.state!=='up'||L.cool>0) return false;
    let dx=L.x-fromX, dz=L.z-fromZ; const d=Math.hypot(dx,dz)||1; dx/=d; dz/=d;
    L.axis.set(dz,0,-dx).normalize(); L.state='fall'; L.vel=3+2*power; L.t=0;
    if(World.ready){ SFX.kick(); tone(220,.3,'square',.15,0,110) }
    return true;
  }
  World.knockLetter=i=>{ const L=letters[i]; if(L) knock(L,L.x+(Math.random()-.5),L.z+3) };
  function letterStep(dt){
    for(const L of letters){
      L.cool-=dt;
      if(L.state==='fall'){ L.vel+=14*Math.sin(Math.max(.05,L.ang))*dt; L.ang+=L.vel*dt;
        if(L.ang>=Math.PI/2){ L.ang=Math.PI/2; if(Math.abs(L.vel)>1.5){ L.vel=-L.vel*.3 } else { L.vel=0; L.state='down'; L.t=0 } } }
      else if(L.state==='down'){ L.t+=dt; if(L.t>1.4){ L.state='rise'; L.vel=-3;
          if(World.ready){ SFX.boing(); SFX.note(L.i); tmpV.set(L.x,3.5,L.z).project(camera); if(tmpV.z<1) burst((tmpV.x+1)/2*innerWidth,(1-tmpV.y)/2*innerHeight,35) } } }
      else { L.vel+=(-50*L.ang-3.2*L.vel)*dt; L.ang+=L.vel*dt;
        if(L.state==='rise'){ L.t+=dt; if(L.t>2.2){ L.state='up'; L.cool=1; L.ang=0; L.vel=0 } } }
      L.pivot.quaternion.setFromAxisAngle(L.axis,L.ang).multiply(new T.Quaternion().setFromAxisAngle(up,-L.x*.03));
      // things hitting a standing letter
      if(L.state==='up'){
        for(const b of balls){ const u=b.userData, dx=b.position.x-L.x, dz=b.position.z-L.z, d=Math.hypot(dx,dz);
          if(d<1.5+u.r && b.position.y<4.2){ const sp=Math.hypot(u.v.x,u.v.z); if(knock(L,b.position.x-u.v.x*.1,b.position.z-u.v.z*.1,Math.min(2,sp/6))){} u.v.x=dx/(d||1)*Math.max(4,sp*.6); u.v.z=dz/(d||1)*Math.max(4,sp*.6) } }
        if(World.walk) for(const k of [izzy,aj]){ const dx=k.position.x-L.x, dz=k.position.z-L.z, d=Math.hypot(dx,dz);
          if(d<1.9){ knock(L,k.position.x,k.position.z,1.5); k.position.x=L.x+dx/(d||1)*1.9; k.position.z=L.z+dz/(d||1)*1.9 } }
      }
    }
  }
  World.ok=true;
  applyPlayer();
  // tap a ball in the world
  const ray=new T.Raycaster(), ndc=new T.Vector2();
  addEventListener('pointerdown',e=>{
    if(!World.ready || e.target.closest('button,a,.panel,#start')) return;
    ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
    const lh=ray.intersectObjects(letterMeshes)[0], bh=ray.intersectObjects(balls)[0];
    if(lh&&(!bh||lh.distance<bh.distance)){ const L=letters[lh.object.userData.letter]; knock(L,camera.position.x,camera.position.z,1.5); burst(e.clientX,e.clientY,20); return }
    const hit=bh; if(!hit) return;
    const u=hit.object.userData; u.v.set((Math.random()-.5)*8,13,(Math.random()-.5)*6);
    SFX[BALL_SFX[u.kind]](); burst(e.clientX,e.clientY,30);
  });
  let px=0,py=0; addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5});
  function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.fov=innerWidth<innerHeight?65:50; camera.updateProjectionMatrix() }
  addEventListener('resize',resize); resize();
  let last=performance.now(), time=0; const tmp=new T.Vector3();
  function frame(now){
    const dt=Math.min(.033,(now-last)/1000); last=now; time+=dt*(reduce?.2:1);
    for(const b of balls){const u=b.userData,p=b.position,v=u.v,r=u.r;
      v.y-=15*dt; p.addScaledVector(v,dt);
      if(p.y<r){p.y=r;v.y=-v.y*.74;if(Math.abs(v.y)<3)v.y=reduce?0:6+Math.random()*6;v.x*=.96;v.z*=.96}
      const d=Math.hypot(p.x,p.z), lim=World.walk?19:12; if(d>lim){v.x-=p.x/d*dt*12;v.z-=p.z/d*dt*12}
      if(!World.walk&&p.z>5)v.z-=dt*8;
      b.rotation.x+=v.z*dt/r; b.rotation.z-=v.x*dt/r;}
    for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],min=a.userData.r+b.userData.r;tmp.subVectors(b.position,a.position);const d=tmp.length();if(d>0&&d<min){tmp.multiplyScalar(1/d);const push=(min-d)/2;a.position.addScaledVector(tmp,-push);b.position.addScaledVector(tmp,push);const rel=tmp.dot(new T.Vector3().subVectors(a.userData.v,b.userData.v));if(rel>0){a.userData.v.addScaledVector(tmp,-rel);b.userData.v.addScaledVector(tmp,rel)}}}
    stars.forEach((s,i)=>{s.rotation.y+=dt*1.5;s.position.y+=Math.sin(time*2+i)*.005});
    clouds.forEach(c=>{c.position.x+=dt*.6;if(c.position.x>40)c.position.x=-40});
    net.rotation.y+=dt*.5;
    portals.forEach((p,i)=>{p.ring.rotation.z=Math.sin(time*1.5+i)*.15; if(p.ready) p.ring.material.emissiveIntensity=.45+Math.sin(time*5)*.25});
    if(World.walk){
      walkStep(dt); kick(izzy,.7); kick(aj,.55);
      want.set(izzy.position.x*.85, 7, izzy.position.z+11); wantLook.set(izzy.position.x, 1.8, izzy.position.z-3);
    } else if(World.create){
      izzy.rotation.y+=dt*.7; animKid(izzy,dt,0,false); animKid(aj,dt,0,false);
      for(const b of balls){ const dx=b.position.x-izzy.position.x-1, dz=b.position.z-izzy.position.z, d=Math.hypot(dx,dz)||1; if(d<5){ b.userData.v.x+=dx/d*dt*45; b.userData.v.z+=dz/d*dt*45 } }
      const wide=innerWidth>900;
      want.set(izzy.position.x+(wide?2.6:.3), wide?3.2:3.8, izzy.position.z+(wide?7.8:8.5)); wantLook.set(izzy.position.x+(wide?2.4:.3), wide?1.4:-.6, izzy.position.z);
    } else {
      animKid(izzy,dt,0,true); animKid(aj,dt,0,false);
      izzy.rotation.y+=(0-izzy.rotation.y)*dt*3; aj.rotation.y+=(-.3-aj.rotation.y)*dt*3;
      if(Math.random()<dt*.5) hop(aj,6);
      const sc=Math.min(1.5,scrollY/innerHeight);
      want.set(Math.sin(time*.12)*3.5+px*2.5, 4.2-py*1.2+sc*3, 17-sc*2); wantLook.set(0,2.2+sc*.5,0);
    }
    petStep(dt); letterStep(dt);
    const kf=1-Math.exp(-dt*(World.walk?5:3)); camPos.lerp(want,kf); look.lerp(wantLook,kf);
    camera.position.copy(camPos); camera.lookAt(look);
    renderer.render(scene,camera); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
try{ initWorld() }catch(e){ console.warn('3D world off',e) }
if(!World.ok) applyPlayer();

/* ---------- interactions ---------- */
$('#name').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const l=b.firstElementChild, i=+b.dataset.i;
  l.classList.remove('jump'); void l.offsetWidth; l.classList.add('jump'); initAudio(); SFX.note(i);
  burst(...centerOf(b),24); if(i===3) setTimeout(()=>say('Izzy!'),250);
});
$('#throw').addEventListener('click',e=>{
  const b=e.target.closest('.ball'); if(!b) return; const k=b.dataset.kind; initAudio(); SFX[BALL_SFX[k]]();
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); World.throwBall(k); burst(...centerOf(b),20);
});
$('#grid').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c) return; const g=GAMES[+c.dataset.g]; initAudio();
  if(g.status==='ready'&&g.url){ SFX.chime(); burst(...centerOf(c),60); setTimeout(()=>location.href=g.url,500); return }
  SFX.soon(); c.classList.remove('wiggle'); void c.offsetWidth; c.classList.add('wiggle'); toast('Coming soon!'); burst(...centerOf(c),14);
});
$('#teamGrid').addEventListener('click',e=>{
  const m=e.target.closest('.mate'); if(!m) return; initAudio(); SFX.cheer(); burst(...centerOf(m),70); say(TEAM[+m.dataset.t].cheer);
});
document.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*18+'deg');c.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*18+'deg')});
  c.addEventListener('pointerleave',()=>{c.style.removeProperty('--rx');c.style.removeProperty('--ry')});
});
$('#toGames').addEventListener('click',()=>{ SFX.tick(); focusEl(document.querySelector('.card')) });
$('#playerBtn').addEventListener('click',()=>{ initAudio(); if(World.ok) World.setCreate(true) });
$('#explore').addEventListener('click',()=>{ initAudio(); if(World.ok) World.setWalk(true) });
$('#exitWalk').addEventListener('click',()=>{ SFX.tick(); World.setWalk(false) });
$('#jumpBtn').addEventListener('pointerdown',e=>{ e.preventDefault(); World.doJump() });
{ const st=$('#stick'), kn=$('#knob'); let id=null;
  const upd=e=>{ const r=st.getBoundingClientRect(); let x=(e.clientX-r.left-r.width/2)/(r.width/2), y=(e.clientY-r.top-r.height/2)/(r.height/2); const m=Math.hypot(x,y); if(m>1){x/=m;y/=m} World.touch.x=x; World.touch.y=y; kn.style.transform=`translate(${x*50}px,${y*50}px)` };
  st.addEventListener('pointerdown',e=>{ id=e.pointerId; st.setPointerCapture(id); upd(e) });
  st.addEventListener('pointermove',e=>{ if(e.pointerId===id) upd(e) });
  const end=()=>{ id=null; World.touch.x=World.touch.y=0; kn.style.transform='' };
  st.addEventListener('pointerup',end); st.addEventListener('pointercancel',end); }
if(!World.ok) document.body.classList.add('nogl');
$('#home').addEventListener('click',()=>{ if(World.walk) World.setWalk(false); if(World.create) World.setCreate(false); SFX.tick(); scrollTo({top:0,behavior:reduce?'auto':'smooth'}) });

/* ---------- start screen ---------- */
let started=false;
function start(){
  if(started) return; started=true; initAudio(); World.ready=true;
  $('#start').classList.add('gone'); $('#name').classList.replace('pre','in');
  SFX.chime(); if(musicOn) setTimeout(startMusic,700);
  setTimeout(()=>{ burst(innerWidth/2,innerHeight*.35,120); say("Hi Izzy! Let's play!") },900);
  setTimeout(()=>document.querySelector('.ball').focus({preventScroll:true}),1200);
}
$('#start').addEventListener('click',start);
$('#go').focus();

/* ---------- keyboard + Xbox controller ---------- */
try{ navigator.gamepadInputEmulation='gamepad' }catch(e){}
const visible = el => (el.offsetParent!==null || getComputedStyle(el).position==='fixed') && getComputedStyle(el).visibility!=='hidden';
function focusEl(el){ if(!el) return; el.focus({preventScroll:true}); el.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'}) }
function move(dir){
  const els=[...document.querySelectorAll('[data-nav]')].filter(visible), cur=document.activeElement;
  if(!els.includes(cur)){ focusEl(els.find(e=>e.classList.contains('ball'))||els[0]); return }
  const r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; let best=null, bd=1e9;
  for(const e of els){ if(e===cur) continue; const q=e.getBoundingClientRect(), x=q.left+q.width/2-cx, y=q.top+q.height/2-cy;
    const main = dir==='left'?-x:dir==='right'?x:dir==='up'?-y:y, side = (dir==='left'||dir==='right')?Math.abs(y):Math.abs(x);
    if(main<=8) continue; const d=main+side*2.2; if(d<bd){bd=d;best=e} }
  if(best){ focusEl(best); SFX.tick() }
}
function pressA(){ if(!started) return start(); const a=document.activeElement; if(a&&a.matches('[data-nav]')) a.click(); else move('down') }
function pressB(){ if(!started) return start(); if(World.create) return World.setCreate(false); SFX.tick(); scrollTo({top:0,behavior:reduce?'auto':'smooth'}); setTimeout(()=>document.querySelector('.ball').focus({preventScroll:true}),300) }
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
const WK={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keyup',e=>{ const k=WK[e.key]; if(k) World.keys[k]=false });
addEventListener('blur',()=>{ World.keys={} });
addEventListener('keydown',e=>{
  if(!started){ if(['Enter',' ','Spacebar'].includes(e.key)||KEYS[e.key]){ e.preventDefault(); start() } return }
  if(World.create && e.key==='Escape'){ World.setCreate(false); return }
  if(World.walk){ const k=WK[e.key]; if(k){ e.preventDefault(); World.keys[k]=true } else if(e.key===' '||e.key==='Spacebar'){ e.preventDefault(); World.doJump() } else if(e.key==='Escape'||e.key==='Backspace'){ e.preventDefault(); World.setWalk(false) } return }
  if(KEYS[e.key]){ e.preventDefault(); move(KEYS[e.key]) }
  else if(e.key==='Escape'||e.key==='GamepadB'){ pressB() }
});
const padState={};
function pollPads(now){
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  for(const gp of gps){ if(!gp) continue;
    const b=i=>gp.buttons[i]&&gp.buttons[i].pressed, ax=gp.axes[0]||0, ay=gp.axes[1]||0;
    let dir=null; if(b(12)||ay<-.55)dir='up'; else if(b(13)||ay>.55)dir='down'; else if(b(14)||ax<-.55)dir='left'; else if(b(15)||ax>.55)dir='right';
    const st=padState[gp.index]||(padState[gp.index]={dir:null,t:0,rep:false,a:false,b:false,x:false});
    if(World.walk){
      const dz=v=>Math.abs(v)<.18?0:v; World.pad.x=dz(ax)+(b(15)?1:0)-(b(14)?1:0); World.pad.y=dz(ay)+(b(13)?1:0)-(b(12)?1:0);
      const A=b(0),B=b(1),X=b(2)||b(3); if(A&&!st.a) World.doJump(); if(B&&!st.b){ SFX.tick(); World.setWalk(false) }
      if(X&&!st.x){ const k=KINDS[Math.floor(Math.random()*3)]; World.throwBall(k); SFX[BALL_SFX[k]]() }
      st.a=A; st.b=B; st.x=X; st.dir='walk'; continue;
    }
    if(st.dir==='walk') st.dir=null;
    if(dir){ if(dir!==st.dir){ started?move(dir):start(); st.t=now; st.rep=false } else if(now-st.t>(st.rep?160:420)){ move(dir); st.t=now; st.rep=true } }
    st.dir=dir;
    const A=b(0),B=b(1),X=b(2)||b(3);
    if(A&&!st.a) pressA(); if(B&&!st.b) pressB();
    if(X&&!st.x&&started){ const k=KINDS[Math.floor(Math.random()*3)]; World.throwBall(k); SFX[BALL_SFX[k]]() }
    st.a=A; st.b=B; st.x=X;
  }
  requestAnimationFrame(pollPads);
}
requestAnimationFrame(pollPads);
addEventListener('resize',sizeFx);
}
